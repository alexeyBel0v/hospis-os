<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f2f4f5" />
    <title>Hospis OS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23147a8c'/%3E%3Cpath d='M9 33h11l5-11 7 20 5-13h18' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#5e6b75">Загрузка Hospis OS…</div>
    </div>
    <script>
      // Если приложение не запустилось — показать причину вместо белого экрана.
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.dataset.started) {
          root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#b42520">Не удалось запустить Hospis OS: ' +
            (e.message || 'файл не найден') + '<br><br>Проверьте, что сайт опубликован через GitHub Actions.</div>';
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
